spring:
  datasource:
    url: jdbc:h2:mem:securelog;DB_CLOSE_DELAY=-1;MODE=STRICT
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: test-only-secret-that-is-longer-than-thirty-two-bytes
    expiration-seconds: 3600
