name: CI and security checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JWT_SECRET: ci-only-secret-value-with-at-least-thirty-two-bytes
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: SAST - SpotBugs
        run: ./mvnw --batch-mode --no-transfer-progress spotbugs:check

      - name: SCA - OWASP Dependency-Check
        run: ./mvnw --batch-mode --no-transfer-progress dependency-check:check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/dependency-check-report.html
          if-no-files-found: warn
